[package]
name = "icarus-diary"
version = "0.1.0"
description = "Icarus Diary — a local-first, air-gapped diarying app."
authors = ["Icarus"]
edition = "2021"
rust-version = "1.98.1"

# The Tauri build pipeline compiles the app's Rust into both a shared library
# (for mobile, unused here) and a binary, so we expose the lib explicitly.
[lib]
name = "icarus_diary_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2.5.2"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
